name: Test, package, and release
on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
  pull_request:
    branches: [ "main" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build with Maven
      run: mvn -B package --file cdb/pom.xml
    - name: Release
      uses: softprops/action-gh-release@v2
      fail_on_unmatched_files: true
      if: github.ref_type == 'tag'
      with:
        files: cdb/target/cdb-1.0.jar
